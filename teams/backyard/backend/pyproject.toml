[project]
name = "trustscore"
version = "0.1.0"
description = "Network-based trust score and bot detection (step 1): open dataset, propagation, clusters, API"
requires-python = ">=3.10"
dependencies = [
  "numpy<2.3", "scipy>=1.13", "pandas>=2.2", "scikit-learn>=1.5", "networkx>=3.3",
  "igraph>=0.11", "leidenalg>=0.10", "fastapi>=0.115", "uvicorn[standard]>=0.30",
  "pyarrow>=16", "pydantic>=2", "tqdm", "requests", "gdown", "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trustscore"]
