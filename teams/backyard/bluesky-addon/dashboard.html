<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trust Score · Bluesky graph</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2330a46c' stroke-width='2.4'%3E%3Cpath d='M12 2.5 4.5 5.5v6c0 5 3.3 8.6 7.5 10 4.2-1.4 7.5-5 7.5-10v-6z'/%3E%3C/svg%3E">
<style>
:root { --bg:#0f1117; --bg2:#171a23; --bg3:#1f2330; --border:#2a2f3d; --text:#e6e8ef; --muted:#9a9fb3; --accent:#4cc9f0; --bot:#e5484d; --human:#30a46c; --amber:#f5b731;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; color: var(--text); background: var(--bg); color-scheme: dark; }
* { box-sizing: border-box; } body { margin: 0; background: var(--bg); } a { color: var(--accent); }
h1,h2,h3 { margin: 0 0 8px; font-weight: 600; } h2 { font-size: 15px; } h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.app { display: flex; flex-direction: column; height: 100vh; }
.topbar { display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--bg2); flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; } .brand span { color: var(--accent); }
.tabs { display: flex; gap: 4px; } .tabs button { background: transparent; border: 1px solid transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.tabs button.active { color: var(--text); background: var(--bg3); border-color: var(--border); } .tabs button:hover { color: var(--text); }
select, input, button.btn { background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
button.btn { cursor: pointer; } button.btn:hover { border-color: var(--accent); } button.btn.small { padding: 2px 8px; font-size: 12px; } button.btn.active { border-color: var(--accent); color: var(--accent); }
button.btn.green { border-color: var(--human); color: #5fd39a; } button.btn.red { border-color: var(--bot); color: #ff8a8e; }
.main { display: flex; flex: 1; min-height: 0; } .content { flex: 1; overflow: auto; padding: 16px 18px; min-width: 0; } .content.net { padding: 0; overflow: hidden; }
.drawer { width: 430px; border-left: 1px solid var(--border); background: var(--bg2); overflow: auto; padding: 14px; }
.grid { display: grid; gap: 14px; margin-bottom: 14px; } .cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); } .cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); } .cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); } .cols-5 { grid-template-columns: repeat(5, minmax(0,1fr)); }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; min-width: 0; }
.card .title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.kpi { font-size: 24px; font-weight: 700; } .kpi small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; } table.tbl th, table.tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.tbl th { color: var(--muted); font-weight: 500; cursor: pointer; user-select: none; } table.tbl tr.clickable { cursor: pointer; } table.tbl tr.clickable:hover { background: var(--bg3); }
table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill.red { background: rgba(229,72,77,.18); color: #ff8a8e; } .pill.green { background: rgba(48,164,108,.18); color: #5fd39a; } .pill.amber { background: rgba(245,183,49,.18); color: #f5b731; } .pill.grey { background: rgba(111,114,133,.25); color: #b9bccb; }
.trustbar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #e5484d, #f5b731, #30a46c); position: relative; margin: 6px 0 4px; } .trustbar .marker { position: absolute; top: -4px; width: 3px; height: 16px; background: #fff; border-radius: 2px; }
.muted { color: var(--muted); } .small { font-size: 12px; } .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); } .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; } .legend .ln { display: inline-block; width: 14px; height: 2px; margin-right: 4px; vertical-align: middle; }
.netwrap { display: flex; flex-direction: column; height: 100%; } .toolbar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--bg2); }
.netcanvas { flex: 1; min-height: 320px; position: relative; background: #0b0d13; } .netcanvas canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
.netcanvas .legend { position: absolute; left: 10px; bottom: 10px; right: 10px; } .netcanvas .hint { position: absolute; top: 10px; left: 10px; font-size: 12px; color: var(--muted); background: rgba(15,17,23,.8); padding: 4px 8px; border-radius: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; display: none; z-index: 5; }
.slider { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); } .slider input[type=range] { width: 110px; padding: 0; }
.contrib { display: grid; grid-template-columns: 1fr 120px 60px; gap: 6px; align-items: center; font-size: 12px; } .bar { height: 8px; border-radius: 3px; background: var(--bg3); position: relative; } .bar > i { position: absolute; top: 0; bottom: 0; }
.pos { color: #5fd39a; } .neg { color: #ff8a8e; }
.md { max-width: 900px; line-height: 1.55; } .md code { background: var(--bg3); padding: 1px 4px; border-radius: 3px; } .md table { border-collapse: collapse; } .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; font-size: 13px; }
.loading { color: var(--muted); padding: 30px; text-align: center; } .error { color: #ff8a8e; padding: 12px; }
svg text { fill: var(--muted); font-size: 11px; } .axis path, .axis line { stroke: var(--border); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 12px; } .facts span { color: var(--muted); display: block; } .facts b { font-weight: 600; }
.flag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: var(--bg3); margin: 2px 4px 2px 0; }
.flag.red { color: #ff8a8e; } .flag.green { color: #5fd39a; } .flag.amber { color: #f5b731; }
.chart { width: 100%; height: 190px; }
</style></head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">Trust<span>Score</span> <span class="muted small">· Bluesky live graph</span></div>
    <div class="tabs" id="tabs">
      <button data-tab="overview">Overview</button><button data-tab="network">Network</button><button data-tab="accounts">Accounts</button><button data-tab="seeds">Seeds</button><button data-tab="method">Method</button>
    </div>
    <div class="muted small" id="topinfo" style="margin-left:auto"></div>
  </div>
  <div class="main">
    <div class="content" id="content"><div class="loading">Loading…</div></div>
    <div class="drawer" id="drawer" hidden></div>
  </div>
</div>
<script src="vendor/d3.min.js"></script>
<script src="dashboard.js"></script>
</body></html>
